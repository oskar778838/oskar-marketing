<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!-- Editorial OM monogram. Uses real text glyphs (Cormorant Garamond
       with a generic serif fallback) so the letters remain unambiguous
       at the small sizes the hero avatar and top-nav cluster render.
       Earlier geometric M-from-lines version read as "V" at 40-56px. -->
  <defs>
    <linearGradient id="omGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8A8FF"/>
      <stop offset="100%" stop-color="#5B5BD6"/>
    </linearGradient>
  </defs>

  <text
    x="100"
    y="100"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'Cormorant Garamond', 'Cormorant', 'Garamond', 'Times New Roman', serif"
    font-size="120"
    font-weight="500"
    letter-spacing="-2"
    fill="url(#omGrad)"
  >OM</text>
</svg>
