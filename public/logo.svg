<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <!-- Editorial O monogram. Ring + serif terminal cap. -->
  <circle cx="32" cy="32" r="22" stroke="#C9A84C" stroke-width="1.25" fill="none" />
  <circle cx="32" cy="32" r="22" stroke="#E8C96A" stroke-width="0.4" fill="none" opacity="0.5" />
  <!-- inner counter -->
  <ellipse cx="32" cy="32" rx="11" ry="14" stroke="#C9A84C" stroke-width="0.7" fill="none" opacity="0.65" />
  <!-- terminal serif accent -->
  <line x1="48" y1="20" x2="54" y2="14" stroke="#C9A84C" stroke-width="1" stroke-linecap="round" />
  <!-- center mark -->
  <circle cx="32" cy="32" r="1.2" fill="#C9A84C" />
</svg>
